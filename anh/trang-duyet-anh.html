<title>Duyệt ảnh HLB</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: thanh trang thai tren cung, moi bai la mot khu, anh xep luoi 2 cot, cot yeu cau anh o cuoi moi bai */
:root {
  --bg: #f3f5f8; --surface: #ffffff; --line: #d9dfe7; --fg: #18222f; --muted: #5b6573;
  --navy: #1f3a5f; --amber: #d48f0c; --amber-soft: #fdf1da; --ok: #1e7a4c; --ok-soft: #e1f3e9;
  --wait: #4a5d78; --wait-soft: #e7edf5;
  --f-body: "Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11161d; --surface: #19212b; --line: #2b3644; --fg: #e6ebf2; --muted: #9aa6b5;
  --navy: #8fb3e6; --amber: #f2b13a; --amber-soft: #3a2c10; --ok: #5cc98f; --ok-soft: #12301f;
  --wait: #a9b9cf; --wait-soft: #222d3a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #11161d; --surface: #19212b; --line: #2b3644; --fg: #e6ebf2; --muted: #9aa6b5;
  --navy: #8fb3e6; --amber: #f2b13a; --amber-soft: #3a2c10; --ok: #5cc98f; --ok-soft: #12301f;
  --wait: #a9b9cf; --wait-soft: #222d3a; color-scheme: dark }

body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 48px; }
.wrap { max-width: 1080px; margin: 0 auto; display: grid; gap: 28px; }
h1 { font-size: 24px; margin: 0; color: var(--navy); text-wrap: balance; }
.lead { margin: 4px 0 0; color: var(--muted); max-width: 65ch; }
.tabs { display: flex; flex-wrap: wrap; gap: 8px; }
.tab { font: inherit; font-size: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--fg);
  padding: 6px 14px; border-radius: 999px; cursor: pointer; font-variant-numeric: tabular-nums; }
.tab[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: var(--bg); }
.tab:focus-visible, button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

.bai { display: grid; gap: 14px; }
.bai-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px;
  border-bottom: 2px solid var(--navy); padding-bottom: 8px; }
.bai-head h2 { margin: 0; font-size: 18px; text-wrap: balance; min-width: 0; }
.bai-head .file { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 440px), 1fr)); gap: 16px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: grid; min-width: 0; }
.card.duyet { border-color: var(--ok); }
.card.lam_lai { border-color: var(--amber); }
.card img { display: block; width: 100%; height: auto; background: var(--line); }
.body { padding: 14px 16px 16px; display: grid; gap: 10px; min-width: 0; }
.top { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; justify-content: space-between; }
.ten { font-family: var(--f-mono); font-size: 13px; font-weight: 500; overflow-wrap: anywhere; }
.pill { font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 999px; white-space: nowrap; }
.pill.cho_duyet { background: var(--wait-soft); color: var(--wait); }
.pill.duyet { background: var(--ok-soft); color: var(--ok); }
.pill.lam_lai { background: var(--amber-soft); color: var(--amber); }
dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 3px 12px; font-size: 13px; }
dt { color: var(--muted); letter-spacing: .02em; }
dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.agent { font-size: 13px; color: var(--muted); background: var(--bg); border-radius: 6px; padding: 8px 10px; }
label { font-size: 13px; font-weight: 600; }
textarea, input[type="text"] { font: inherit; font-size: 14px; width: 100%; box-sizing: border-box; color: var(--fg);
  background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
textarea { min-height: 64px; resize: vertical; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { font: inherit; font-size: 14px; font-weight: 600; border-radius: 6px; padding: 8px 16px; cursor: pointer; border: 1px solid transparent; }
.btn.ok { background: var(--ok); color: var(--surface); }
.btn.redo { background: var(--amber-soft); color: var(--amber); border-color: var(--amber); }
.btn.ghost { background: transparent; color: var(--muted); border-color: var(--line); font-weight: 500; }
.btn[disabled] { opacity: .5; cursor: progress; }
.err { color: var(--amber); font-size: 13px; }

.req { background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 10px; }
.req h3 { margin: 0; font-size: 15px; }
.req p { margin: 0; font-size: 13px; color: var(--muted); }
.req form { display: grid; gap: 8px; }
.req ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.req li { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 14px; }
.req li .txt { flex: 1 1 260px; min-width: 0; overflow-wrap: anywhere; }
.empty { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 24px; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .card { transition: border-color .2s; } }
</style>

<div class="wrap">
  <header>
    <h1>Duyệt ảnh bài viết HLB</h1>
    <p class="lead">Bấm Duyệt cho ảnh dùng được. Ảnh chưa ưng thì ghi lý do rồi bấm Làm lại. Thiếu ảnh nào thì ghi tên hoặc mô tả ảnh ở cuối mỗi bài. Agent đọc trang này khi bạn nhắn "xử lý ảnh đã duyệt".</p>
  </header>
  <nav class="tabs" id="tabs" aria-label="Lọc theo trạng thái"></nav>
  <main id="list" class="wrap" style="gap:36px">
    <div class="empty">Đang tải ảnh. Ảnh xuất hiện ở đây sau khi agent tạo ảnh tải lên trang này.</div>
  </main>
</div>

<script>
const LABEL = { cho_duyet: "Chờ duyệt", duyet: "Đã duyệt", lam_lai: "Chờ làm lại" };
const NGUON = { python: "Vẽ bằng Python", canva: "Ảnh minh họa Canva", website: "Ảnh sản phẩm trên website", "nguoi-dung": "Ảnh bạn gửi" };
let db = null, anh = [], yeuCau = [], loc = "cho_duyet", readOnly = false;
const drafts = {};

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $ = s => document.querySelector(s);

function counts() {
  const c = { tat_ca: anh.length, cho_duyet: 0, duyet: 0, lam_lai: 0 };
  anh.forEach(a => { c[a.trang_thai || "cho_duyet"]++; });
  return c;
}

function renderTabs() {
  const c = counts();
  const tabs = [["cho_duyet", "Chờ duyệt"], ["lam_lai", "Chờ làm lại"], ["duyet", "Đã duyệt"], ["tat_ca", "Tất cả"]];
  $("#tabs").innerHTML = tabs.map(([k, t]) =>
    `<button class="tab" type="button" data-loc="${k}" aria-pressed="${loc === k}">${t} ${c[k]}</button>`).join("");
}

function card(a) {
  const st = a.trang_thai || "cho_duyet";
  const note = drafts[a.id] ?? a.ghi_chu ?? "";
  return `<article class="card ${st}">
    ${a.url ? `<img src="${esc(a.url)}" alt="${esc(a.alt)}" loading="lazy" width="${a.rong || 820}" height="${a.cao || 461}">` : ""}
    <div class="body">
      <div class="top"><span class="ten">${esc(a.ten)}</span><span class="pill ${st}">${LABEL[st]}${a.vong > 1 ? " · lần " + a.vong : ""}</span></div>
      <dl>
        <dt>Mục</dt><dd>${esc(a.muc)}</dd>
        <dt>Alt</dt><dd>${esc(a.alt)}</dd>
        <dt>Nguồn</dt><dd>${esc(NGUON[a.nguon] || a.nguon)}${a.rong ? `, ${a.rong} x ${a.cao} px` : ""}</dd>
      </dl>
      ${a.ghi_chu_agent ? `<div class="agent">${esc(a.ghi_chu_agent)}</div>` : ""}
      <label for="note-${esc(a.id)}">Ghi chú cho agent</label>
      <textarea id="note-${esc(a.id)}" data-note="${esc(a.id)}" placeholder="Ví dụ: đèn phải là UFO tròn dẹt, chụp góc thấp hơn" ${readOnly ? "disabled" : ""}>${esc(note)}</textarea>
      <div class="actions">
        <button class="btn ok" type="button" data-act="duyet" data-id="${esc(a.id)}" ${readOnly ? "disabled" : ""}>Duyệt</button>
        <button class="btn redo" type="button" data-act="lam_lai" data-id="${esc(a.id)}" ${readOnly ? "disabled" : ""}>Làm lại</button>
        ${st !== "cho_duyet" ? `<button class="btn ghost" type="button" data-act="cho_duyet" data-id="${esc(a.id)}" ${readOnly ? "disabled" : ""}>Bỏ chọn</button>` : ""}
      </div>
      <div class="err" data-err="${esc(a.id)}" hidden></div>
    </div>
  </article>`;
}

function reqBlock(bai) {
  const items = yeuCau.filter(r => r.bai === bai).sort((x, y) => (x.tao_luc || "").localeCompare(y.tao_luc || ""));
  return `<section class="req">
    <h3>Yêu cầu thêm ảnh</h3>
    <p>Ghi tên file hoặc mô tả ảnh còn thiếu, ví dụ "so-sanh-goc-chieu-60-120-do.jpg" hoặc "ảnh kho kệ cao treo đèn dọc lối đi". Agent tạo ảnh rồi đưa lên đây để bạn duyệt.</p>
    ${items.length ? `<ul>${items.map(r => `<li><span class="pill ${r.trang_thai === "da_xu_ly" ? "duyet" : "lam_lai"}">${r.trang_thai === "da_xu_ly" ? "Đã tạo" : "Chờ tạo"}</span>
      <span class="txt">${esc(r.noi_dung)}${r.ghi_chu ? ` (${esc(r.ghi_chu)})` : ""}${r.phan_hoi ? `<br><small>${esc(r.phan_hoi)}</small>` : ""}</span>
      ${r.trang_thai !== "da_xu_ly" && !readOnly ? `<button class="btn ghost" type="button" data-del="${esc(r.id)}">Xóa</button>` : ""}</li>`).join("")}</ul>` : ""}
    ${readOnly ? "" : `<form data-bai="${esc(bai)}">
      <label for="req-${esc(bai)}">Ảnh cần thêm</label>
      <input type="text" id="req-${esc(bai)}" name="noi_dung" required placeholder="Tên file hoặc mô tả ảnh">
      <input type="text" id="req-note-${esc(bai)}" name="ghi_chu" placeholder="Đặt ở đoạn nào, cần thể hiện gì (không bắt buộc)" aria-label="Ghi chú vị trí và nội dung ảnh">
      <div class="actions"><button class="btn ok" type="submit">Gửi yêu cầu</button></div>
    </form>`}
  </section>`;
}

function render() {
  renderTabs();
  const active = document.activeElement, activeId = active && active.id, sel = active && active.selectionStart;
  const bais = [...new Set([...anh.map(a => a.bai), ...yeuCau.map(r => r.bai)])].filter(Boolean).sort();
  if (!bais.length) {
    $("#list").innerHTML = `<div class="empty">Chưa có ảnh nào. Ảnh xuất hiện ở đây sau khi agent tạo ảnh tải lên trang này.</div>`;
    return;
  }
  $("#list").innerHTML = bais.map(bai => {
    const rows = anh.filter(a => a.bai === bai).sort((x, y) => (x.thu_tu ?? 99) - (y.thu_tu ?? 99));
    const shown = rows.filter(a => loc === "tat_ca" || (a.trang_thai || "cho_duyet") === loc);
    const title = (rows[0] && rows[0].tieu_de_bai) || bai;
    const done = rows.filter(a => a.trang_thai === "duyet").length;
    return `<section class="bai">
      <div class="bai-head"><h2>${esc(title)}</h2><span class="file">${esc(bai)}.md · đã duyệt ${done}/${rows.length}</span></div>
      ${shown.length ? `<div class="grid">${shown.map(card).join("")}</div>` : `<div class="empty">Không có ảnh nào ở mục này.</div>`}
      ${reqBlock(bai)}
    </section>`;
  }).join("");
  if (activeId) { const el = document.getElementById(activeId); if (el) { el.focus(); try { el.setSelectionRange(sel, sel); } catch (e) {} } }
}

document.addEventListener("input", e => { const id = e.target.dataset && e.target.dataset.note; if (id) drafts[id] = e.target.value; });

document.addEventListener("click", async e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.loc) { loc = t.dataset.loc; render(); return; }
  if (!db) return;
  if (t.dataset.act) {
    const id = t.dataset.id, ta = document.querySelector(`[data-note="${CSS.escape(id)}"]`);
    const note = ta ? ta.value.trim() : "";
    const errEl = document.querySelector(`[data-err="${CSS.escape(id)}"]`);
    if (t.dataset.act === "lam_lai" && !note) { errEl.textContent = "Ghi lý do cần làm lại để agent biết sửa gì."; errEl.hidden = false; ta && ta.focus(); return; }
    t.disabled = true;
    try {
      await db.doc("anh/" + id).update({ trang_thai: t.dataset.act, ghi_chu: note, cap_nhat: new Date().toISOString() });
      delete drafts[id];
    } catch (err) {
      errEl.textContent = err.code === "invalid_argument" ? "Bạn chỉ có quyền xem trang này, không lưu được lựa chọn." : "Chưa lưu được, thử lại sau ít giây.";
      errEl.hidden = false; t.disabled = false;
    }
  }
  if (t.dataset.del) {
    t.disabled = true;
    try { await db.doc("yeu_cau/" + t.dataset.del).delete(); } catch (err) { t.disabled = false; }
  }
});

document.addEventListener("submit", async e => {
  const f = e.target.closest("form[data-bai]"); if (!f) return;
  e.preventDefault();
  if (!db) return;
  const noi = f.noi_dung.value.trim(); if (!noi) return;
  const btn = f.querySelector("button"); btn.disabled = true;
  try {
    await db.collection("yeu_cau").add({ bai: f.dataset.bai, noi_dung: noi, ghi_chu: f.ghi_chu.value.trim(), trang_thai: "moi", tao_luc: new Date().toISOString() });
    f.reset();
  } catch (err) { btn.disabled = false; }
});

renderTabs();
(async () => {
  db = await claude.use("db");
  if (!db) { $("#list").innerHTML = `<div class="empty">Không mở được dữ liệu ảnh. Đăng nhập claude.ai rồi mở lại trang để duyệt.</div>`; return; }
  const user = await claude.use("user");
  if (user && (await user.can("data.write")) === false) readOnly = true;
  db.collection("anh").onSnapshot(s => { anh = s.docs.map(d => ({ id: d.id, ...d.data() })); render(); },
    () => { $("#list").innerHTML = `<div class="empty">Mất kết nối dữ liệu. Tải lại trang.</div>`; });
  db.collection("yeu_cau").onSnapshot(s => { yeuCau = s.docs.map(d => ({ id: d.id, ...d.data() })); render(); }, () => {});
})();
</script>
